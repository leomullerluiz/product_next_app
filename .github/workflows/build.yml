name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build static export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate .env from repository secrets
        shell: bash
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${{ secrets.NEXT_PUBLIC_SENTRY_ENVIRONMENT }}
          NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE }}
        run: |
          set -euo pipefail

          if [ -z "${NEXT_PUBLIC_API_BASE_URL}" ]; then
            echo "::error title=Missing repository secret::NEXT_PUBLIC_API_BASE_URL is required to build this app."
            exit 1
          fi

          {
            printf 'NEXT_PUBLIC_API_BASE_URL=%s\n' "${NEXT_PUBLIC_API_BASE_URL}"
            printf 'NEXT_PUBLIC_SITE_URL=%s\n' "${NEXT_PUBLIC_SITE_URL}"
            printf 'NEXT_PUBLIC_SENTRY_DSN=%s\n' "${NEXT_PUBLIC_SENTRY_DSN}"
            printf 'NEXT_PUBLIC_SENTRY_ENVIRONMENT=%s\n' "${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-production}"
            printf 'NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE=%s\n' "${NEXT_PUBLIC_SENTRY_TRACES_SAMPLE_RATE:-0}"
          } > .env

          echo ".env generated from repository secrets."

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
